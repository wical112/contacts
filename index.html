<style>
  :root {
    --accent:        #0a84ff;       /* iOS system blue */
    --accent-dim:    #0066d4;
    --accent-soft:   rgba(10,132,255,.18);
    --bg:            #0e1117;
    --bg-2:          #161b22;
    --bg-3:          #21262d;
    --border:        #30363d;
    --text:          #e5e7eb;
    --text-dim:      #9ca3af;
    --text-fade:     #6b7280;
  }
  html,body{background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK",system-ui,sans-serif;
       padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:none}
  /* iOS standalone PWA：黑色透明狀態列、需要把內容下推免被時間列覆蓋 */
  header.app-header{padding-top:env(safe-area-inset-top, 0px)}
  .glass{background:rgba(22,27,34,.78);backdrop-filter:saturate(140%) blur(14px)}
  .card{background:var(--bg-2);border:1px solid var(--bg-3);border-radius:18px}
  .chip{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .6rem;border-radius:999px;
        font-size:.72rem;background:var(--bg-3);color:var(--text-dim);border:1px solid var(--border);
        scroll-snap-align:start;flex-shrink:0;white-space:nowrap}
  .chip-on{background:var(--accent-soft);color:#93c5fd;border-color:var(--accent)}
  .chip-industry{background:rgba(59,130,246,.15);color:#93c5fd;border-color:rgba(59,130,246,.4)}
  .chip-region{background:rgba(34,197,94,.15);color:#86efac;border-color:rgba(34,197,94,.4)}
  .chip-seniority{background:rgba(168,85,247,.15);color:#d8b4fe;border-color:rgba(168,85,247,.4)}
  .chip-channel{background:rgba(249,115,22,.15);color:#fdba74;border-color:rgba(249,115,22,.4)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
       padding:.6rem .9rem;border-radius:12px;font-weight:600;font-size:.92rem;
       transition:transform .08s ease, background .15s ease, opacity .15s ease;
       -webkit-user-select:none;user-select:none}
  .btn:active{transform:scale(.96)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-dim)}
  .btn-ghost{background:var(--bg-3);color:var(--text)}
  .btn-ghost:hover{background:var(--border)}
  .btn-danger{background:#7f1d1d;color:#fecaca}
  .icon-btn{width:40px;height:40px;padding:0;border-radius:12px;background:var(--bg-3);color:var(--text);
            display:inline-flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;
            transition:transform .08s ease, background .15s ease}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn.on{background:var(--accent-soft);color:#93c5fd}
  .field{width:100%;padding:.6rem .75rem;background:#0d1117;border:1px solid var(--border);
         border-radius:12px;color:var(--text);font-size:.95rem}
  .field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .label{font-size:.72rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.2rem}
  details>summary{list-style:none;cursor:pointer}
  details>summary::-webkit-details-marker{display:none}
  .modal-shell{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
               background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
  .modal-sheet{width:100%;max-width:680px;max-height:92vh;overflow:auto;background:var(--bg);
               border-top:1px solid var(--border);border-radius:24px 24px 0 0;padding:0 1rem 2rem;
               animation:slideUp .22s ease;position:relative}
  .modal-bar{position:sticky;top:0;background:var(--bg);padding:.75rem 0 .6rem;z-index:5;
             display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--bg-3);margin-bottom:.75rem}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
  @keyframes slideDownTop{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
  @media(min-width:768px){
    .modal-shell{align-items:center}
    .modal-sheet{border-radius:24px;border:1px solid var(--border)}
  }
  .spinner{width:18px;height:18px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;
           animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .scroll-x{overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .scroll-x::-webkit-scrollbar{display:none}
  .empty{color:var(--text-fade);font-style:italic;font-size:.85rem}
  a.link{color:#93c5fd;text-decoration:underline;text-decoration-color:rgba(10,132,255,.5)}
  .toast{position:fixed;left:50%;top:1rem;transform:translateX(-50%);z-index:60;
         background:#1f2937;color:var(--text);border:1px solid #374151;padding:.55rem .9rem;border-radius:12px;
         font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;
         max-width:90vw;text-align:center}
  .toast.on{opacity:1}

  /* Search expand animation */
  #qWrap{max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease, opacity .15s ease}
  #qWrap.open{max-height:60px;opacity:1;padding-bottom:.5rem}

  /* List contact row */
  .row-link{display:flex;align-items:center;gap:.75rem;padding:.85rem .9rem;
            background:var(--bg-2);border:1px solid var(--bg-3);border-radius:18px;
            transition:transform .08s ease, background .15s ease;cursor:pointer;-webkit-user-select:none;user-select:none}
  .row-link:active{transform:scale(.985);background:#1a1f26}
  .row-link .chevron{color:var(--text-fade);font-size:1.2rem;margin-left:auto;flex-shrink:0}

  /* Avatar — hashColor bg + emoji industry badge */
  .avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
          font-weight:700;font-size:1.05rem;flex-shrink:0;position:relative;line-height:1}
  .avatar .ind{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;
               background:var(--bg);border:1.5px solid var(--bg-2);display:flex;align-items:center;
               justify-content:center;font-size:.6rem}

  /* FAB speed-dial */
  #fab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);right:18px;z-index:40;
       display:flex;flex-direction:column;align-items:flex-end;gap:.6rem}
  #fab.left{right:auto;left:18px;align-items:flex-start}
  .fab-main{width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;
            font-size:1.6rem;display:flex;align-items:center;justify-content:center;
            box-shadow:0 12px 28px rgba(10,132,255,.4), 0 4px 10px rgba(0,0,0,.3);
            transition:transform .15s ease;-webkit-user-select:none;user-select:none}
  .fab-main:active{transform:scale(.94)}
  .fab-main.expanded{transform:rotate(45deg)}
  .fab-sub{height:42px;padding:0 .9rem .05rem 1rem;border-radius:21px;background:var(--bg-2);
           border:1px solid var(--bg-3);color:var(--text);display:none;align-items:center;gap:.4rem;
           box-shadow:0 6px 16px rgba(0,0,0,.35);font-size:.88rem;font-weight:500;
           opacity:0;transform:translateY(8px);transition:transform .2s ease, opacity .2s ease}
  #fab.open .fab-sub{display:inline-flex;opacity:1;transform:none}
  #fab.open .fab-sub:nth-child(1){transition-delay:.05s}
  #fab.open .fab-sub:nth-child(2){transition-delay:.1s}

  /* Quick-action menu (long-press) */
  .quick-menu{position:fixed;z-index:55;background:var(--bg-2);border:1px solid var(--bg-3);
              border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:.4rem;min-width:160px;
              animation:popIn .15s ease}
  @keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  .quick-menu button{display:flex;align-items:center;gap:.6rem;width:100%;padding:.6rem .8rem;
                     background:transparent;color:var(--text);border-radius:8px;font-size:.92rem;text-align:left}
  .quick-menu button:hover,.quick-menu button:active{background:var(--bg-3)}

  /* Tag bar group label */
  .tg-label{font-size:.66rem;color:var(--text-fade);text-transform:uppercase;letter-spacing:.08em;
            padding:0 .3rem;display:inline-flex;align-items:center;align-self:center;flex-shrink:0}

  /* Empty state */
  .empty-illu{width:120px;height:120px;margin:0 auto 1rem;color:var(--bg-3)}

  /* Section quick-jump rail (editor) */
  .qjump{position:absolute;left:4px;top:60px;display:flex;flex-direction:column;gap:.3rem;z-index:6}
  .qjump button{width:30px;height:30px;border-radius:50%;background:var(--bg-3);color:var(--text-dim);
                font-size:.7rem;font-weight:600}
  .qjump button.on{background:var(--accent-soft);color:#93c5fd}
</style>

<!-- ====== HEADER ====== -->
<header class="glass sticky top-0 z-30 border-b border-[#21262d] app-header">
  <div class="max-w-3xl mx-auto px-3 py-2 flex items-center gap-1.5">

<!-- ====== Templates rendered into #modalRoot ====== -->
<div id="modalRoot"></div>

<script>
/* ---------- Firebase config ----------
   呢個 config 係 public-by-design（Firebase web config 唔係 secret）
   真 authz 喺 firestore.rules + storage.rules：只限 OWNER_EMAIL 讀寫。 */
const FB = {
  apiKey: "AIzaSyAYxzkQvaBKIz-QdvabttvrBvatYLLXt_c",
  authDomain: "wicalyu-contacts.firebaseapp.com",
  projectId: "wicalyu-contacts",
  storageBucket: "wicalyu-contacts.firebasestorage.app",
  appId: "1:584434930894:web:b2366f0fc96d01e9f9ac9f"
};
/* OCR proxy = Firebase Function asia-east1 (server-side ID-token verify + email allowlist) */
const OCR_URL    = "https://asia-east1-wicalyu-contacts.cloudfunctions.net/ocr";
const ENRICH_URL = "https://asia-east1-wicalyu-contacts.cloudfunctions.net/enrich";

/* ---------- State ---------- */
const S = {
  user: null,
  contacts: [],          // [{id, ...}]
  selectedTags: new Set(),
  query: "",
  ready: false,
  unsub: null
};

/* ---------- Utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const fmtDate = ts => {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const m = (d.getMonth()+1).toString().padStart(2,"0");
  const day = d.getDate().toString().padStart(2,"0");
  return `${d.getFullYear()}-${m}-${day}`;
};
const toast = (msg, ms=2200) => {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("on"), ms);
};
const uuid = () => crypto.randomUUID();

/* ---------- Search normalize + scoring ----------
   Build per-contact search index on Firestore snapshot (once per data change).
   Render uses scoreMatch（prefix > phone-digit > substring）並 sort by relevance + updatedAt。 */
const normPhone = s => {
  const d = String(s||"").replace(/[^\d+]/g, "");
  // HK 8-digit 自動 prefix 852 做 canonical（搜「9286」可撞「+852 9286 ...」）
  const noPlus = d.replace(/^\+/, "");
  return noPlus.length === 8 && /^[2-9]/.test(noPlus) ? "852" + noPlus : noPlus;
};
const normText = s => String(s||"").normalize("NFC").toLowerCase().trim();
const tokenize = s => normText(s).split(/[\s·,，、\/]+/).filter(Boolean);
const emailLocal = e => normText(e).split("@")[0] || "";

function buildSearchIndex() {
  S._idx = S.contacts.map(c => {
    const tokens = new Set([
      ...tokenize(c.name), ...tokenize(c.title), ...tokenize(c.company),
      ...(c.tags||[]).flatMap(tokenize),
    ]);
    const phones = (c.phones||[]).map(p => normPhone(p.value));
    const emails = (c.emails||[]).map(p => normText(p.value));
    const emailLocals = emails.map(e => e.split("@")[0]);
    const hay = normText([
      c.name, c.title, c.company, c.notes,
      ...(c.phones||[]).map(p => p.value),
      ...(c.emails||[]).map(p => p.value),
      ...(c.websites||[]),
      ...(c.tags||[])
    ].filter(Boolean).join(" "));
    return { id: c.id, tokens: [...tokens], phones, emails, emailLocals, hay,
             nameN: normText(c.name), companyN: normText(c.company) };
  });
}

function scoreMatch(idx, q) {
  if (!q) return 1; // no query → all match (sort 仍用 updatedAt)
  const qn = normText(q);
  const qdigits = q.replace(/[^\d]/g, "");
  let score = 0;
  // name prefix
  if (idx.nameN && idx.nameN.startsWith(qn)) score = Math.max(score, 1000);
  // company prefix
  if (idx.companyN && idx.companyN.startsWith(qn)) score = Math.max(score, 700);
  // phone digit substring（normalized）
  if (qdigits.length >= 3) {
    for (const p of idx.phones) if (p.includes(qdigits)) { score = Math.max(score, 500); break; }
  }
  // email local prefix
  for (const e of idx.emailLocals) if (e.startsWith(qn)) { score = Math.max(score, 350); break; }
  // token prefix（任何 tokenized field）
  for (const t of idx.tokens) if (t.startsWith(qn)) { score = Math.max(score, 450); break; }
  // any field substring（fallback）
  if (idx.hay.includes(qn)) score = Math.max(score, 400);
  return score;
}

/* ---------- Firebase boot ---------- */
let app, auth, db, storage;
let provider;

function fbBoot() {
  if (typeof firebase === "undefined") return setTimeout(fbBoot, 60);
  app = firebase.initializeApp(FB);
  auth = firebase.auth();
  db = firebase.firestore();
  storage = firebase.storage();
  provider = new firebase.auth.GoogleAuthProvider();
  auth.onAuthStateChanged(onAuth);
  $("#btnSignIn").addEventListener("click", async () => {
    try { await auth.signInWithPopup(provider); }
    catch (e) {
      if (e.code === "auth/popup-blocked") await auth.signInWithRedirect(provider);
      else toast("登入失敗：" + (e.message || e.code));
    }
  });
}

function onAuth(u) {
  if (!u) {
    if (S.unsub) { S.unsub(); S.unsub = null; }
    S.user = null;
    $("#gate").classList.remove("hidden");
    $("#main").classList.add("hidden");
    $("#fab").classList.add("hidden");
    $("#status").textContent = "未登入";
    return;
  }
  S.user = u;
  $("#gate").classList.add("hidden");
  $("#main").classList.remove("hidden");
  $("#fab").classList.remove("hidden");
  $("#status").textContent = (u.displayName || u.email || "已登入") + " · 載入中…";
  // 立即顯示 loading skeleton；onSnapshot 來時 render() 會覆寫
  $("#list").innerHTML = `<div class="card p-8 text-center text-sm text-gray-400">
    <div class="spinner mx-auto mb-3"></div>讀緊雲端資料…</div>`;
  subscribeContacts();
}

function subscribeContacts() {
  if (S.unsub) S.unsub();
  S.unsub = db.collection("users").doc(S.user.uid).collection("contacts")
    .orderBy("updatedAt", "desc")
    .onSnapshot(snap => {
      S.contacts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      buildSearchIndex();
      S.ready = true;
      const n = S.contacts.length;
      $("#status").textContent = (S.user.displayName || S.user.email || "已登入")
        + ` · ${n} 個聯絡人`;
      render();
    }, err => {
      console.error("firestore subscribe", err);
      $("#status").textContent = "讀取失敗 · " + (err.code || err.message || "");
      $("#list").innerHTML = `<div class="card p-6 text-center text-sm text-red-300">
        ❌ 讀取失敗<div class="text-xs text-gray-400 mt-2">${esc(err.code||"")} ${esc(err.message||"")}</div></div>`;
      toast("讀取失敗：" + (err.code || err.message || "unknown"));
    });
}

/* ---------- Render ---------- */
function allTags() {
  const m = new Map();
  for (const c of S.contacts) (c.tags||[]).forEach(t => m.set(t, (m.get(t)||0) + 1));
  return Array.from(m.entries()).sort((a,b) => b[1] - a[1]);
}
// 按 namespace prefix 分組（industry/* / region/* / seniority/* / channel/* / 自由）
const TAG_GROUPS = [
  { ns: "industry",  label: "行業", cls: "chip-industry" },
  { ns: "region",    label: "地區", cls: "chip-region" },
  { ns: "seniority", label: "職位", cls: "chip-seniority" },
  { ns: "channel",   label: "渠道", cls: "chip-channel" },
  { ns: "",          label: "自由", cls: "" }
];
function groupTags(entries) {
  const groups = TAG_GROUPS.map(g => ({ ...g, items: [] }));
  for (const [t, n] of entries) {
    const slash = t.indexOf("/");
    const ns = slash > 0 ? t.slice(0, slash) : "";
    const grp = groups.find(g => g.ns === ns) || groups[groups.length - 1];
    grp.items.push([t, n]);
  }
  return groups.filter(g => g.items.length);
}
// Industry namespace → emoji（avatar 角落小 badge）
const INDUSTRY_EMOJI = {
  finance: "💰", legal: "⚖️", tech: "💻", healthcare: "🏥",
  education: "🎓", manufacturing: "🏭", retail: "🛍️", hospitality: "🏨",
  media: "📺", government: "🏛️", consulting: "🧠", realestate: "🏢",
  logistics: "🚚", marketing: "📣", ngo: "🤝"
};
function industryEmoji(tags) {
  for (const t of (tags || [])) {
    if (t.startsWith("industry/")) {
      const k = t.slice(9);
      if (INDUSTRY_EMOJI[k]) return INDUSTRY_EMOJI[k];
    }
  }
  return null;
}
// Tag → chip class (for grouped colour)
function tagClass(t) {
  for (const g of TAG_GROUPS) if (g.ns && t.startsWith(g.ns + "/")) return g.cls;
  return "";
}
// 顯示 tag 嘅短 label（去 prefix）
function tagShort(t) {
  const i = t.indexOf("/");
  return i > 0 ? t.slice(i + 1) : t;
}
// Deterministic hash → HSL color（avatar bg）
function hashColor(s) {
  let h = 5381; const str = String(s || "·");
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  const hue = ((h >>> 0) % 360);
  return { bg: `hsl(${hue} 35% 24%)`, fg: `hsl(${hue} 75% 80%)` };
}
function matchTags(c) {
  if (!S.selectedTags.size) return true;
  const t = new Set(c.tags||[]);
  for (const s of S.selectedTags) if (!t.has(s)) return false;
  return true;
}
function render() {
  if (!S.ready) return;
  // ── tag bar：按 namespace 分組、上色、加 group label ──
  const tagBar = $("#tagBar");
  const entries = allTags();
  if (!entries.length) {
    tagBar.classList.add("hidden");
    tagBar.innerHTML = "";
  } else {
    tagBar.classList.remove("hidden");
    const groups = groupTags(entries);
    tagBar.innerHTML = groups.map(g => {
      const items = g.items.map(([t, n]) => {
        const on = S.selectedTags.has(t);
        const cls = on ? "chip-on" : g.cls;
        return `<button data-tag="${esc(t)}" class="chip ${cls}">${esc(tagShort(t))} <span class="opacity-60">${n}</span></button>`;
      }).join("");
      const label = g.ns ? `<span class="tg-label">${g.label}</span>` : "";
      return label + items;
    }).join('<span class="tg-label opacity-30">·</span>');
  }
  // ── list：score-based filter + relevance sort ──
  const idxById = new Map((S._idx||[]).map(i => [i.id, i]));
  const q = S.query;
  let filtered;
  if (!q) {
    filtered = S.contacts.filter(matchTags);
  } else {
    filtered = S.contacts
      .filter(matchTags)
      .map(c => ({ c, s: scoreMatch(idxById.get(c.id) || {}, q) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || ((b.c.updatedAt?.seconds||0) - (a.c.updatedAt?.seconds||0)))
      .map(x => x.c);
  }
  const list = $("#list");
  const empty = $("#emptyState");
  if (!S.contacts.length) {
    empty.classList.remove("hidden"); list.innerHTML = ""; return;
  }
  empty.classList.add("hidden");
  if (!filtered.length) {
    list.innerHTML = `<div class="card p-6 text-center text-sm text-gray-400">無 match。試下清 search 或 tag。</div>`;
    return;
  }
  list.innerHTML = filtered.map(c => {
    const phone = (c.phones||[])[0]?.value || "";
    const email = (c.emails||[])[0]?.value || "";
    const visTags = (c.tags||[]).filter(t => !t.startsWith("industry/")).slice(0, 3); // industry 喺 avatar 角顯示
    const tagsHtml = visTags.map(t => `<span class="chip ${tagClass(t)}">${esc(tagShort(t))}</span>`).join("");
    const { bg, fg } = hashColor(c.name || c.company || c.id);
    const ind = industryEmoji(c.tags);
    const initial = (c.name || c.company || "·").slice(0,1);
    return `<div class="row-link" data-id="${esc(c.id)}">
      <div class="avatar" style="background:${bg};color:${fg}">
        ${esc(initial)}${ind ? `<span class="ind">${ind}</span>` : ""}
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-[15px] font-semibold truncate leading-tight">${esc(c.name || "（無名）")}</div>
        <div class="text-[12px] text-gray-400 truncate leading-tight mt-0.5">
          ${esc([c.title, c.company].filter(Boolean).join(" · ")) || `<span class="empty">未填職位／公司</span>`}
        </div>
        <div class="text-[11px] text-gray-500 truncate mt-0.5">${esc(phone || email || fmtDate(c.capturedAt))}</div>
        ${tagsHtml ? `<div class="mt-1.5 flex gap-1 flex-wrap">${tagsHtml}</div>` : ""}
      </div>
      <span class="chevron" aria-hidden="true">›</span>
    </div>`;
  }).join("");
  // 普通 tap 入 detail；長按出 quick-action
  list.querySelectorAll(".row-link").forEach(el => attachRowGesture(el));
  tagBar.querySelectorAll("[data-tag]").forEach(el => {
    el.addEventListener("click", () => {
      const t = el.dataset.tag;
      if (S.selectedTags.has(t)) S.selectedTags.delete(t); else S.selectedTags.add(t);
      render();
    });
  });
}

/* ---------- Long-press quick action（call / email / vcard） ---------- */
function attachRowGesture(el) {
  const id = el.dataset.id;
  let pressTimer = 0;
  let moved = false;
  let suppress = false;
  const onStart = (x, y) => {
    moved = false; suppress = false;
    pressTimer = setTimeout(() => {
      if (moved) return;
      suppress = true;
      try { navigator.vibrate && navigator.vibrate(15); } catch {}
      openQuickAction(id, x, y);
    }, 500);
  };
  const cancel = () => { clearTimeout(pressTimer); pressTimer = 0; };
  el.addEventListener("touchstart", e => onStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  el.addEventListener("touchmove", () => { moved = true; cancel(); }, { passive: true });
  el.addEventListener("touchend", cancel);
  el.addEventListener("touchcancel", cancel);
  el.addEventListener("contextmenu", e => { e.preventDefault(); openQuickAction(id, e.clientX, e.clientY); suppress = true; });
  el.addEventListener("click", e => {
    if (suppress) { e.stopPropagation(); return; }
    openDetail(id);
  });
}
function openQuickAction(id, x, y) {
  closeQuickAction();
  const c = S.contacts.find(x => x.id === id);
  if (!c) return;
  const phone = (c.phones||[])[0]?.value;
  const email = (c.emails||[])[0]?.value;
  const menu = document.createElement("div");
  menu.className = "quick-menu";
  menu.id = "quickMenu";
  const items = [];
  if (phone) items.push(`<button data-act="call"><span>📞</span> 打 ${esc(phone)}</button>`);
  if (email) items.push(`<button data-act="email"><span>✉️</span> Email ${esc(email)}</button>`);
  items.push(`<button data-act="vcard"><span>📥</span> 加入手機通訊錄</button>`);
  items.push(`<button data-act="open"><span>👁️</span> 睇詳情</button>`);
  menu.innerHTML = items.join("");
  document.body.appendChild(menu);
  // position：避免出界
  const w = 200, h = menu.offsetHeight || 180;
  const left = Math.min(x, window.innerWidth - w - 12);
  const top  = Math.min(y, window.innerHeight - h - 12);
  menu.style.left = left + "px";
  menu.style.top  = top  + "px";
  menu.querySelector('[data-act="call"]')?.addEventListener("click", () => { closeQuickAction(); location.href = "tel:" + phone; });
  menu.querySelector('[data-act="email"]')?.addEventListener("click", () => { closeQuickAction(); location.href = "mailto:" + email; });
  menu.querySelector('[data-act="vcard"]')?.addEventListener("click", () => { closeQuickAction(); downloadVcf(c); });
  menu.querySelector('[data-act="open"]')?.addEventListener("click", () => { closeQuickAction(); openDetail(id); });
  setTimeout(() => document.addEventListener("click", closeQuickAction, { once: true }), 50);
}
function closeQuickAction() { document.getElementById("quickMenu")?.remove(); }

async function handleCamFile(f) {

    openEditor({ ...draft, _photoB64: base64, _photoPreview: dataUrl });
  } catch (err) {

}

async function prepImage(file) {
  const img = new Image();
  const url = URL.createObjectURL(file);
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const MAX = 1280;
  const ratio = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * ratio);
  const h = Math.round(img.naturalHeight * ratio);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(url);
  const dataUrl = c.toDataURL("image/jpeg", 0.82);
  const base64 = dataUrl.split(",", 2)[1];
  return { base64, dataUrl };
}

async function ocrCard(base64) {
  showLoader("讀緊名片… AI 思考中");
  try {
    const token = await S.user.getIdToken();
    const r = await fetch(OCR_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ image: base64, mime: "image/jpeg" })
    });
    if (!r.ok) {
      const t = await r.text().catch(()=>"");
      throw new Error(`HTTP ${r.status}: ${t.slice(0,200)}`);
    }
    const data = await r.json();
    return normalizeDraft(data);
  } finally {
    hideLoader();
  }
}
// 把 Function 返嘅 4 個 enum array flatten 入 tags[] 加 namespace prefix
function enumToTags(d) {
  const out = [];
  for (const ns of ["industry","region","seniority","channel"]) {
    const key = ns + "s"; // industries, regions, seniorities, channels — 但 seniority 已是 plural 形
    // 修正：industries / regions / seniority / channels（seniority 唔加 s）
    const realKey = ns === "seniority" ? "seniority" : key;
    const arr = d[realKey];
    if (Array.isArray(arr)) for (const v of arr) if (v) out.push(ns + "/" + v);
  }
  return out;
}
/* ---------- Batch enrich：對未有 industry/* tag 嘅 contact 跑 text-only enrich ---------- */
async function enrichAllMissing() {
  const candidates = S.contacts.filter(c => !(c.tags||[]).some(t => t.startsWith("industry/")));
  if (!candidates.length) return toast("所有人都已有 industry tag，唔需要補");
  const cap = 50;
  if (candidates.length > cap) {
    if (!confirm(`有 ${candidates.length} 個聯絡人未派 tag。今次處理頭 ${cap} 個，可再撳一次處理其餘？`)) return;
  }
  const batch = candidates.slice(0, cap);
  showLoader(`AI 補緊 tag… 0 / ${batch.length}`);
  const token = await S.user.getIdToken();
  let ok = 0, fail = 0;
  for (let i = 0; i < batch.length; i++) {
    const c = batch[i];
    try {
      const r = await fetch(ENRICH_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ name: c.name||"", title: c.title||"", company: c.company||"", notes: c.notes||"" })
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const enriched = await r.json();
      const merged = mergeEnrichedTags(c.tags, enriched);
      if (merged.length !== (c.tags||[]).length || JSON.stringify(merged) !== JSON.stringify(c.tags||[])) {
        await db.collection("users").doc(S.user.uid).collection("contacts").doc(c.id)
          .update({ tags: merged, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      }
      ok++;
    } catch (e) {
      console.error("enrich fail", c.id, e);
      fail++;
    }
    showLoader(`AI 補緊 tag… ${i+1} / ${batch.length}`);
  }
  hideLoader();
  toast(`完成：${ok} 個成功${fail ? `、${fail} 個失敗` : ""}`);
}

function normalizeDraft(d) {
  d = d || {};
  const enumTags = enumToTags(d);
  const freeTags = Array.isArray(d.tags) ? d.tags.filter(t => !/^(industry|region|seniority|channel)\//.test(t)) : [];
  return {
    name: d.name || "",
    title: d.title || "",
    company: d.company || "",
    phones: Array.isArray(d.phones) ? d.phones : [],
    emails: Array.isArray(d.emails) ? d.emails : [],
    addresses: Array.isArray(d.addresses) ? d.addresses : [],
    websites: Array.isArray(d.websites) ? d.websites : [],
    notes: d.notes || "",
    tags: [...new Set([...enumTags, ...freeTags])]
  };
}
// merge enum tags 入現有 contact 嘅 tags[]（保留所有 free-form tag、replace 同 namespace 嘅）
function mergeEnrichedTags(existing, enriched) {
  const namespaces = new Set(["industry","region","seniority","channel"]);
  const kept = (existing || []).filter(t => {
    const ns = t.split("/")[0];
    return !namespaces.has(ns); // 留低自由 tag、清舊 namespace tag
  });
  const added = enumToTags(enriched);
  return [...new Set([...kept, ...added])];
}

    data.addresses = data.addresses.filter(Boolean).map(s=>s.trim()).filter(Boolean);
    if (!data.name && !data.company && !data.phones.length && !data.emails.length) {
      return toast("起碼填一樣：名 / 公司 / 電話 / email");
    }
    try {
      showLoader("儲存中…");
      await saveContact(data, existingId, photoB64);
      hideLoader();
      shell.remove();
      toast("已儲存");
    } catch (err) {
      hideLoader();
      console.error(err);
      toast("儲存失敗：" + (err.message || err));
    }
  });

  const del = shell.querySelector('[data-act="delete"]');
  if (del) del.addEventListener("click", async () => {
    if (!confirm("確定刪除呢個聯絡人？")) return;
    try {
      await db.collection("users").doc(S.user.uid).collection("contacts").doc(existingId).delete();
      shell.remove();
      toast("已刪除");
    } catch (err) {
      toast("刪除失敗：" + (err.message || err));
    }
  });
}

async function saveContact(data, existingId, photoB64) {
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  const id = existingId || uuid();
  const ref = db.collection("users").doc(S.user.uid).collection("contacts").doc(id);
  let photoUrl = null;
  if (photoB64) {
    const blob = b64ToBlob(photoB64, "image/jpeg");
    const path = `users/${S.user.uid}/cards/${id}.jpg`;
    const snap = await storage.ref(path).put(blob, { contentType: "image/jpeg" });
    photoUrl = await snap.ref.getDownloadURL();
  }
  const payload = {
    name: data.name, title: data.title, company: data.company,
    phones: data.phones, emails: data.emails,
    addresses: data.addresses, websites: data.websites,
    notes: data.notes, tags: data.tags,
    updatedAt: ts
  };
  if (!existingId) payload.capturedAt = ts;
  if (photoUrl) payload.photoUrl = photoUrl;
  await ref.set(payload, { merge: true });
}

function b64ToBlob(b64, type) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i=0; i<bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type });
}

/* ---------- vCard export ---------- */
function vEsc(s){ return String(s||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n"); }
function buildVcf(c) {
  const lines = ["BEGIN:VCARD","VERSION:3.0"];
  if (c.name) lines.push(`FN:${vEsc(c.name)}`);
  if (c.name) lines.push(`N:${vEsc(c.name)};;;;`);
  if (c.company || c.title) {
    if (c.company) lines.push(`ORG:${vEsc(c.company)}`);
    if (c.title) lines.push(`TITLE:${vEsc(c.title)}`);
  }
  (c.phones||[]).forEach(p => {
    if (!p.value) return;
    const type = (p.label||"").toLowerCase().includes("mobile") || /^9|^6|^5/.test(p.value) ? "CELL" : "WORK";
    lines.push(`TEL;TYPE=${type}:${vEsc(p.value)}`);
  });
  (c.emails||[]).forEach(p => {
    if (!p.value) return;
    lines.push(`EMAIL;TYPE=WORK:${vEsc(p.value)}`);
  });
  (c.websites||[]).forEach(w => { if (w) lines.push(`URL:${vEsc(w)}`); });
  (c.addresses||[]).forEach(a => { if (a) lines.push(`ADR;TYPE=WORK:;;${vEsc(a)};;;;`); });
  if (c.notes) lines.push(`NOTE:${vEsc(c.notes)}`);
  if ((c.tags||[]).length) lines.push(`CATEGORIES:${(c.tags||[]).map(vEsc).join(",")}`);
  lines.push("END:VCARD");
  return lines.join("\r\n");
}
function downloadVcf(c) {
  const vcf = buildVcf(c);
  const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${(c.name||"contact").replace(/[^\w一-鿿 -]/g,"_")}.vcf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

      const claims = JSON.parse(atob(tok.split('.')[1]));
      const safe = { ...claims };
      delete safe.firebase; // big nested obj
      // Direct Storage probe: try writing tiny 1-byte file to validate rules
      const probePath = `users/${S.user.uid}/cards/debug-${Date.now()}.jpg`;

      } catch (e) { storageProbe = "FAIL: " + (e.code || e.message); }

    a.download = `contacts-${new Date().toISOString().slice(0,10)}.vcf`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  });
}

/* ---------- iOS「加到主畫面」提示 ----------
   只對 iOS Safari、未 standalone、未近 7 日 dismiss 嘅 user，第一次開 app 5 秒後 slide-down 細 banner。 */
function maybeShowInstallHint() {
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true
    || window.matchMedia("(display-mode: standalone)").matches;
  if (!isIOS || isStandalone) return;
  const until = +localStorage.getItem("a2hs_dismissed_until") || 0;
  if (Date.now() < until) return;
  setTimeout(() => {
    if (document.getElementById("a2hsBanner")) return;
    const b = document.createElement("div");
    b.id = "a2hsBanner";
    b.className = "glass fixed left-3 right-3 z-50 rounded-2xl p-3 flex items-center gap-3 shadow-2xl border border-[#30363d]";
    // 改放頂部、緊貼 header 下方，避免擋住列表中段；scroll 時自動收起
    b.style.cssText = "top:calc(env(safe-area-inset-top, 0px) + 96px);animation:slideDownTop .3s ease";
    b.innerHTML = `
      <div class="text-xl shrink-0">📲</div>
      <div class="flex-1 text-sm leading-tight">
        <div class="font-semibold">加我入主畫面</div>
        <div class="text-[12px] text-gray-400">撳分享掣 <span style="color:#0a84ff">⎋</span> → 加到主畫面</div>
      </div>
      <button class="btn btn-ghost text-xs py-1 px-2" id="a2hsClose">知道</button>`;
    document.body.appendChild(b);
    const dismiss = (persist) => {
      if (persist) localStorage.setItem("a2hs_dismissed_until", Date.now() + 7 * 24 * 3600 * 1000);
      b.style.transition = "opacity .2s, transform .2s";
      b.style.opacity = "0"; b.style.transform = "translateY(-12px)";
      setTimeout(() => b.remove(), 220);
    };
    b.querySelector("#a2hsClose").addEventListener("click", () => dismiss(true));
    // 用戶一滾動就視為「睇緊」、自動收起（不寫 7 日 dismiss）
    const onScroll = () => { dismiss(false); window.removeEventListener("scroll", onScroll); };
    setTimeout(() => window.addEventListener("scroll", onScroll, { passive: true }), 800);
  }, 5000);
}
